[env:esp32-s3-naujas]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

upload_speed = 921600
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINOJSON_USE_LONG_LONG=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

; --- Bibliotekos ---
lib_deps =
    bblanchon/ArduinoJson @ 6.17.3
    tzapu/WiFiManager @ ^2.0.17

lib_extra_dirs = lib
lib_ldf_mode = deep+

upload_port = COM4
;upload_speed = 115200

; --- OTA įkėlimas per WiFi (be laido) ---
; Įrenginyje: palaikyti mygtuką ~8 s -> ekrane "OTA režimas" su IP adresu.
; Tada: pio run -e ota -t upload   (arba --upload-port <IP is ekrano>)
[env:ota]
extends = env:esp32-s3-naujas
upload_protocol = espota
upload_port = orustotele.local