      <path d="M8 4 Q15 10 11 20 L4 13 Q6 8 8 4 Z" fill="#1c1c1a"/>
      <path d="M0 10 V58"/>
    </g>
    <!-- Sketis: apvalus kupolas, banguotas krastas -->
    <g transform="translate(250,222)">
      <path d="M-30 26 a30 30 0 0 1 60 0 q-15 -8 -30 0 q-15 -8 -30 0 z" fill="#ffffff"/>
      <path d="M0 26 v-7 M0 26 v34 a9 9 0 0 1 -15 -4"/>
    </g>
  </g>
  <text x="360" y="220" font-size="14" fill="#5f5e5a" letter-spacing="1">KAIP RENGTIS</text>
  <text x="360" y="250" font-size="23" font-weight="bold" fill="#1c1c1a">Dangus šiandien verkia — megztinis,</text>
  <text x="360" y="280" font-size="23" font-weight="bold" fill="#1c1c1a">ant viršaus striukė, o skėtis draugas</text>
  <line x1="20" y1="298" x2="940" y2="298" stroke="#1c1c1a" stroke-width="1.5"/>

  <!-- Adaptacijos info: koeficientas + paskutinis atsiliepimas + isvada -->
