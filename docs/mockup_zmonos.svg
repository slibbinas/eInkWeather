  </g>
  <path d="M628 122 h30 M652 116 a6 6 0 1 1 6 6" stroke="#1c1c1a" stroke-width="2.5" fill="none"/>
  <text x="672" y="132" font-size="26" fill="#1c1c1a">5 m/s ŠV</text>
  <path d="M632 158 a10 10 0 0 1 20 0 c0 8 -10 18 -10 18 c0 0 -10 -10 -10 -18 z" fill="#1c1c1a"/>
  <text x="672" y="176" font-size="26" fill="#1c1c1a">lietus 70%</text>

