  <text x="30" y="348" font-size="17" font-weight="500" fill="#1c1c1a">Dažniau jaučiate šaltį — renku šilčiau 🧣</text>

  <!-- Rytas / Diena / Vakaras: didesni; temperatura iki piktogramos vidurio, ikona salia -->
  <g font-weight="bold" fill="#1c1c1a" text-anchor="middle" font-size="20">
    <text x="160" y="388">Rytas</text>
    <text x="480" y="388">Diena</text>
    <text x="800" y="388">Vakaras</text>
  </g>
  <g stroke="#1c1c1a" stroke-width="2.5" fill="#ffffff">
