  <g stroke="#1c1c1a" stroke-width="2.6" fill="none" stroke-linecap="round">
    <!-- Megztinis: drabuzio siluetas, tiesus krastai + svelniai suapvalinti kampai -->
    <g transform="translate(80,214)">
      <path d="M-8 4 L-28 4 Q-32 4 -32 8 L-32 20 Q-32 24 -28 24 L-24 24 Q-20 24 -19 20 L-18 16 L-18 54 Q-18 58 -14 58 L14 58 Q18 58 18 54 L18 16 L19 20 Q20 24 24 24 L28 24 Q32 24 32 20 L32 8 Q32 4 28 4 L8 4 Q0 10 -8 4 Z"/>
      <path d="M-16 32 q4 -5 8 0 t8 0 t8 0 t8 0"/>
      <path d="M-16 43 q4 -5 8 0 t8 0 t8 0 t8 0"/>
      <path d="M-12 50 v6 M-6 50 v6 M0 50 v6 M6 50 v6 M12 50 v6"/>
    </g>
    <!-- Striuke: tas pats siluetas + apykakle + uztrauktukas -->
    <g transform="translate(166,214)">
      <path d="M-8 4 L-28 4 Q-32 4 -32 8 L-32 20 Q-32 24 -28 24 L-24 24 Q-20 24 -19 20 L-18 16 L-18 54 Q-18 58 -14 58 L14 58 Q18 58 18 54 L18 16 L19 20 Q20 24 24 24 L28 24 Q32 24 32 20 L32 8 Q32 4 28 4 L8 4 Q0 10 -8 4 Z"/>
