    <path d="M432 448 a15 15 0 0 1 15 -13 a17 17 0 0 1 33 4 a13 13 0 0 1 -3 25 l-42 0 a14 14 0 0 1 -3 -16"/>
    <path d="M752 448 a15 15 0 0 1 15 -13 a17 17 0 0 1 33 4 a13 13 0 0 1 -3 25 l-42 0 a14 14 0 0 1 -3 -16"/>
  </g>
  <g stroke="#1c1c1a" stroke-width="2" stroke-linecap="round">
    <line x1="444" y1="468" x2="440" y2="478"/><line x1="456" y1="468" x2="452" y2="478"/><line x1="468" y1="468" x2="464" y2="478"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#1c1c1a">
    <text x="196" y="462">13°</text>
    <text x="516" y="462">16°</text>
    <text x="836" y="462">14°</text>
  </g>

  <!-- APACIA: visas baras (miestas + data + wifi + baterija), linija virsuje -->
  <line x1="5" y1="496" x2="955" y2="496" stroke="#888880" stroke-width="1.5"/>
  <text x="15" y="524" font-size="21" font-weight="bold" fill="#1c1c1a">Vilnius</text>
  <text x="150" y="524" font-size="18" fill="#1c1c1a">Penktadienis, 11-07-2026  @  07:30:12</text>
  <g fill="#1c1c1a">
    <rect x="690" y="510" width="40" height="16" rx="2" fill="none" stroke="#1c1c1a" stroke-width="2"/>
    <rect x="730" y="514" width="4" height="8"/>
    <rect x="692" y="512" width="30" height="12"/>
    <text x="742" y="524" font-size="16">78%  3.98v</text>
  </g>
  <g fill="#1c1c1a">
    <rect x="884" y="518" width="6" height="8"/><rect x="894" y="514" width="6" height="12"/>
    <rect x="904" y="510" width="6" height="16"/><rect x="914" y="506" width="6" height="20"/><rect x="924" y="502" width="6" height="24"/>
  </g>
</svg>
