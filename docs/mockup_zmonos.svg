<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif" stroke-linejoin="round">
  <rect x="0" y="0" width="960" height="540" fill="#ffffff" stroke="#888880" stroke-width="2"/>

  <!-- Virsuje TIK mygtuko indikatorius: trikampis rodo fizini mygtuka virs ekrano -->
  <polygon points="360,5 372,19 348,19" fill="#1c1c1a"/>
  <text x="384" y="18" font-size="14" font-weight="500" fill="#1c1c1a">spausk viršutinį mygtuką — PILNA PROGNOZĖ</text>

  <!-- Didele oru piktograma (debesis su lietumi) -->
  <path d="M62 118 a32 32 0 0 1 32 -27 a40 40 0 0 1 76 9 a27 27 0 0 1 -6 53 l-96 0 a30 30 0 0 1 -6 -35" fill="#ffffff" stroke="#1c1c1a" stroke-width="5"/>
  <g stroke="#1c1c1a" stroke-width="4" stroke-linecap="round">
    <line x1="88" y1="166" x2="80" y2="184"/><line x1="120" y1="166" x2="112" y2="184"/><line x1="152" y1="166" x2="144" y2="184"/>
  </g>

  <!-- Temperatura: didelis = jutimine, mazas ir ne centre = termometras -->
  <text x="415" y="72" font-size="22" fill="#5f5e5a" text-anchor="middle">jaučiasi kaip</text>
  <text x="415" y="150" font-size="92" font-weight="bold" fill="#1c1c1a" text-anchor="middle">14°</text>
  <text x="272" y="180" font-size="17" fill="#5f5e5a">termometras rodo 16°</text>

  <!-- Desinys stulpelis: maks/min/vejas/lietus dideli su rodyklemis -->
  <g fill="#1c1c1a">
    <polygon points="628,78 640,78 634,64"/>
    <text x="650" y="86" font-size="30" font-weight="500">18°</text>
    <polygon points="748,70 760,70 754,84"/>
